<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>自己紹介</title>
  <link rel="stylesheet" href="/arg1/assets/styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>＊自己紹介＊</h1>
    </header>

    <p>項目だけ。</p>
    <p>長文むり。</p>

    <ul class="list">
      <li>なまえ：<span id="name">――――</span></li>
      <li>性格：<span id="personality">――――</span></li>
      <li>すき：<span id="likes">――――</span></li>
      <li>きらい：<span id="dislikes">――――</span></li>
      <li>くせ：<span id="habit">――――</span></li>
      <li>ひとこと：<span id="note">――――</span></li>
    </ul>

    <p class="small">※追記するかも</p>
    <p><a href="/arg1/index.html">TOPへ</a></p>
  </div>

  <script src="/arg1/assets/common.js"></script>
  <script>
  (() => {
    const visits = window.Arg1.addPageVisit("profile");
    if (visits >= 3) {
      window.Arg1.grantFrag("frag_profile");
    }

    const setText = (id, text) => {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    };

    if (window.Arg1.hasFrag("frag_diary") || visits >= 4) {
      setText("personality", "ちょい強がり");
      setText("habit", "夜に元気");
    }
    if (window.Arg1.hasFrag("frag_links") || visits >= 4) {
      setText("likes", "夜 / つめたい炭酸 / 巡回");
    }
    if (window.Arg1.hasFrag("frag_bbs") || visits >= 5) {
      setText("dislikes", "決めつけ");
      setText("note", "見てるなら、見てて。");
    }
    if (window.Arg1.hasFrag("frag_secret") || visits >= 6) {
      setText("note", "最後だけは、置いとく。");
    }
  })();
  </script>
</body>
</html>
