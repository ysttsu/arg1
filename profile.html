<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>自己紹介</title>
  <link rel="stylesheet" href="/arg1/assets/styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="c-postTitle__ttl">＊自己紹介＊</h1>
    </header>

    <div class="zprof-section">
      <div class="zprof-heading">概要</div>
      <div class="zprof-content">項目だけ。
長文むり。</div>
    </div>

    <div class="zprof-section">
      <div class="zprof-heading">プロフィール</div>
      <div class="zprof-content">なまえ：<span id="name">――――</span>
性格：<span id="personality">――――</span>
すき：<span id="likes">――――</span>
きらい：<span id="dislikes">――――</span>
くせ：<span id="habit">――――</span>
ひとこと：<span id="note">――――</span></div>
    </div>

    <p class="small">※追記するかも</p>
    <p><a href="/arg1/index.html">TOPへ</a></p>
  </div>

  <script src="/arg1/assets/common.js"></script>
  <script>
  (() => {
    const visits = window.Arg1.addPageVisit("profile");
    if (visits >= 3) {
      window.Arg1.grantFrag("frag_profile");
    }

    const setText = (id, text) => {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    };

    if (window.Arg1.hasFrag("frag_diary") || visits >= 4) {
      setText("personality", "ちょい強がり");
      setText("habit", "夜に元気");
    }
    if (window.Arg1.hasFrag("frag_links") || visits >= 4) {
      setText("likes", "夜 / つめたい炭酸 / 巡回");
    }
    if (window.Arg1.hasFrag("frag_bbs") || visits >= 5) {
      setText("dislikes", "決めつけ");
      setText("note", "見てるなら、見てて。");
    }
    if (window.Arg1.hasFrag("frag_secret") || visits >= 6) {
      setText("note", "最後だけは、置いとく。");
    }
  })();
  </script>
</body>
</html>
