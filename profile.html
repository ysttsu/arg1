<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>自己紹介</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="c-postTitle__ttl">＊自己紹介＊</h1>
    </header>

    <div class="zprof-section">
      <div class="zprof-heading">概要</div>
      <div class="zprof-content">項目だけ。
長文むり。</div>
    </div>

    <div class="zprof-section">
      <div class="zprof-heading">プロフィール</div>
      <div class="zprof-content"><span class="zprof-label">なまえ</span><span id="name">――――</span>
<span class="zprof-label">性格</span><span id="personality">――――</span>
<span class="zprof-label">すき</span><span id="likes">――――</span>
<span class="zprof-label">きらい</span><span id="dislikes">――――</span>
<span class="zprof-label">くせ</span><span id="habit">――――</span>
<span class="zprof-label">ひとこと</span><span id="note">――――</span></div>
    </div>

    <p class="small">※追記するかも</p>
    <p><a href="./index.html">TOPへ</a></p>
  </div>

  <script src="./assets/common.js"></script>
  <script>
  (() => {
    const visits = window.Arg1.addPageVisit("profile");
    if (visits >= 3) {
      window.Arg1.grantFrag("frag_profile");
    }

    const setText = (id, text) => {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    };

    // フラグベース + 高い訪問回数フォールバック
    if (window.Arg1.hasFrag("frag_diary") || visits >= 8) {
      setText("personality", "ちょい強がり");
      setText("habit", "夜に元気");
    }
    if (window.Arg1.hasFrag("frag_links") || visits >= 12) {
      setText("likes", "夜 / つめたい炭酸 / 巡回");
    }
    if (window.Arg1.hasFrag("frag_bbs") || visits >= 16) {
      setText("dislikes", "決めつけ");
      setText("note", "見てるなら、最後まで見てて。");
    }
    if (window.Arg1.hasFrag("frag_secret") || visits >= 20) {
      setText("note", "最後まで、置いとく。");
    }
  })();
  </script>
</body>
</html>
