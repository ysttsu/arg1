<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>＊個人サイト＊（復旧ログ）</title>
  <link rel="stylesheet" href="/arg1/assets/styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>＊ようこそ＊</h1>
    </header>

    <p>昔の個人サイトのアーカイブです。</p>
    <p>リンク切れとか、たまにあります。</p>
    <p>（ゆっくり直します）</p>
    <p class="small">あなたは【<span id="visitCount">?</span>】人目のお客さん</p>

    <h2>★MENU★</h2>
    <ul class="menu" id="menuList"></ul>

    <h2>★おまけ★</h2>
    <ul class="menu">
      <li><a href="/arg1/kiriban.html">キリ番報告はこちら</a><span class="note">踏み逃げ禁止（嘘）</span></li>
      <li><a href="/arg1/sozai.html">素材置き場</a><span class="note">そのうち</span></li>
      <li><a href="/arg1/renraku.html">相互リンク募集中</a><span class="note">気が向いたら</span></li>
    </ul>

    <div class="footer">
      <p>since 200X / 管理人：？？？</p>
      <p>最終更新：不明</p>
    </div>
  </div>

  <script src="/arg1/assets/common.js"></script>
  <script>
  (() => {
    const visits = window.Arg1.addVisit();
    const visitEl = document.getElementById("visitCount");
    if (visitEl) visitEl.textContent = String(visits);

    const items = [
      { label: "自己紹介", href: "/arg1/profile.html", note: "（とりあえず）" },
      { label: "日記", href: "/arg1/diary.html", note: "（たまに更新）", req: ["frag_profile"] },
      { label: "リンク", href: "/arg1/links.html", note: "（巡回用）", req: ["frag_diary"] },
      { label: "掲示板", href: "/arg1/bbs.html", note: "（ログ）", req: ["frag_links"] },
      { label: "倉庫", href: "/arg1/secret.html", note: "（古いメモ）", req: ["frag_bbs"] },
      { label: "完成ページ", href: "/arg1/ending.html", note: "（たぶん）", req: ["frag_secret"] }
    ];

    const list = document.getElementById("menuList");
    if (!list) return;
    items.forEach((item) => {
      const ok = !item.req || item.req.every((id) => window.Arg1.hasFrag(id));
      if (!ok) return;
      const li = document.createElement("li");
      const link = document.createElement("a");
      link.href = item.href;
      link.textContent = item.label;
      li.appendChild(link);
      if (item.note) {
        const note = document.createElement("span");
        note.className = "note";
        note.textContent = item.note;
        li.appendChild(note);
      }
      list.appendChild(li);
    });
  })();
  </script>
</body>
</html>
