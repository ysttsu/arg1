<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>アーカイブ</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <script src="./assets/common.js"></script>
  <script>
  window.Arg1.softRedirectToIndexIfNeeded(["frag_bbs"]);
  </script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>＊アーカイブ＊</h1>
    </header>

    <p>古いメモ。</p>
    <p>残す用。</p>

    <div class="block">
      <div class="zprof-heading">メモ</div>
      <p>欠けても。</p>
      <p>残るのが先。</p>
      <p>直すの、あとで。</p>
      <p>たぶん。</p>
      <p>見てる人がいるなら。</p>
      <p>消したくない。</p>
    </div>

    <p class="small">※移動：完成ページ（そのうち）</p>
    <p><a href="./index.html">TOPへ</a></p>
  </div>

  <script>
  (() => {
    const visits = window.Arg1.addPageVisit("archive");
    if (visits >= 3) {
      window.Arg1.grantFrag("frag_archive");
    }
    if (visits >= 2) {
      const block = document.querySelector(".block");
      if (!block) return;
      const extra = [
        "繋げる。",
        "ほどけない。",
        "手を、離さない。"
      ];
      extra.forEach((line) => {
        const p = document.createElement("p");
        p.textContent = line;
        block.appendChild(p);
      });
    }
    if (visits >= 4) {
      const block = document.querySelector(".block");
      if (!block) return;
      const more = [
        "もう少し。",
        "最後まで、残す。"
      ];
      more.forEach((line) => {
        const p = document.createElement("p");
        p.textContent = line;
        block.appendChild(p);
      });
    }
  })();
  </script>
</body>
</html>
