<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>アーカイブ</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <script src="./assets/common.js"></script>
  <script>
  window.Arg1.softRedirectToIndexIfNeeded(["frag_bbs"]);
  </script>
</head>
<body class="has-archive-bar">
  <div class="archive-bar">
    <span class="archive-bar__icon">📦</span>
    <span class="archive-bar__text">このサイトは 200X年 に保存されたアーカイブです</span>
    <a class="archive-bar__link" href="#">詳細</a>
  </div>
  <div class="wrap">
    <header>
      <h1>＊アーカイブ＊</h1>
    </header>

    <div class="retro-marquee"><span>✦ 古いメモ ✦ 残す用 ✦ 消さないで ✦</span></div>

    <p>古いメモ。</p>
    <p>残す用。</p>

    <div class="block" id="archiveBlock1">
      <div class="zprof-heading">メモ</div>
      <p>欠けても。</p>
      <p>残るのが先。</p>
      <p>直すの、あとで。</p>
      <p>たぶん。</p>
      <p>見てる人がいるなら。</p>
      <p>消したくない。</p>
    </div>

    <div class="block" id="archiveBlock2">
      <div class="zprof-heading">覚え書き</div>
      <p>ここは、残す場所。</p>
      <p>他のページ、壊れても。</p>
      <p>ここだけは。</p>
      <p>形が変わっても。</p>
      <p>意味が残れば。</p>
    </div>

    <div class="deco-hr">━━✧━━✧━━</div>

    <p class="small">※移動：完成ページ（<span id="hiddenLink" class="hidden-link">そのうち</span>）</p>
    <p><a href="./index.html">TOPへ</a></p>
  </div>

  <script>
  (() => {
    // 隠しリンク処理
    const hiddenLink = document.getElementById("hiddenLink");
    if (hiddenLink && !window.Arg1.hasFrag("frag_archive")) {
      const originalText = hiddenLink.textContent;
      hiddenLink.onclick = () => {
        hiddenLink.textContent = "……待ってて";
        window.Arg1.grantFrag("frag_archive");
        setTimeout(() => {
          hiddenLink.textContent = originalText;
        }, 1500);
      };
    }

    const visits = window.Arg1.addPageVisit("archive");
    const block1 = document.getElementById("archiveBlock1");
    const block2 = document.getElementById("archiveBlock2");

    const addLines = (block, lines) => {
      if (!block) return;
      lines.forEach((line) => {
        const p = document.createElement("p");
        p.textContent = line;
        block.appendChild(p);
      });
    };

    // frag_archive取得済み：追加コンテンツ
    if (window.Arg1.hasFrag("frag_archive")) {
      addLines(block1, [
        "繋げる。",
        "ほどけない。",
        "手を、離さない。",
        "前のページ、消した。",
        "前の、も。",
        "見ない方が良かったから。",
        "でも、残ってるかも。",
        "404の奥に。"
      ]);
      addLines(block2, [
        "前は、もっとあった。",
        "素材置き場。お気に入りの曲。",
        "日記も、もっと。",
        "いつ消えた？",
        "覚えてない。",
        "覚えてないのが、怖い。"
      ]);
    }

    // frag_yoru取得済み：最終コンテンツ
    if (window.Arg1.hasFrag("frag_yoru")) {
      addLines(block1, [
        "もう少し。",
        "最後まで、残す。",
        "読んでくれた人へ。",
        "ここに、いた。"
      ]);
    }
  })();
  </script>
</body>
</html>
