<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>掲示板</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <script src="./assets/common.js"></script>
  <script>
  window.Arg1.softRedirectToIndexIfNeeded(["frag_links"]);
  </script>
</head>
<body class="has-archive-bar">
  <div class="archive-bar">
    <span class="archive-bar__icon">📦</span>
    <span class="archive-bar__text">このサイトは 200X年 に保存されたアーカイブです</span>
    <a class="archive-bar__link" href="#">詳細</a>
  </div>
  <div class="wrap">
    <header>
      <h1>＊掲示板＊</h1>
    </header>

    <div class="retro-marquee"><span>☆ 掲示板 ☆ 荒らしはスルーで ☆ 晒し禁止 ☆</span></div>

    <p class="small">ログだけ</p>
    <p class="small">書き込み停止中</p>

    <div id="bbsLogs"></div>

    <div class="reply-section">
      <button id="replyBtn" class="reply-btn">返信する（停止中）</button>
    </div>

    <div class="deco-hr">━━♡━━♡━━</div>
    <p><a href="./log/200x.html">過去ログ</a></p>
    <p class="small">（無い）</p>
    <p><a href="./report.html">削除依頼フォーム</a></p>
    <p class="small">（準備中）</p>
    <p><a href="./rules.html">掲示板ルール</a></p>
    <p class="small">（未整備）</p>

    <p><a href="./index.html">TOPへ</a></p>
  </div>

  <script>
  (() => {
    window.Arg1.addPageVisit("bbs");

    const logs = [
      // === 起：和やかな交流 ===
      // 常時表示
      {
        show: true,
        name: "夜更かしさん",
        lines: [
          "100番踏みました！",
          "キリ番報告です♪",
          "サイトかわいいですね。"
        ]
      },
      {
        show: true,
        name: "管理人",
        lines: [
          "おめ！ありがと。",
          "夜中に来てくれてうれしい。",
          "また来てね。"
        ]
      },
      {
        show: true,
        name: "通りすがり",
        lines: [
          "セカチュー見ました？",
          "泣きすぎてティッシュやばかった。"
        ]
      },
      {
        show: true,
        name: "管理人",
        lines: [
          "見た。泣いた。",
          "夜中に一人で見るの、しみる。"
        ]
      },
      { show: true, name: "名無しさん", lines: ["見てるよ。", "更新まだ？"] },
      { show: true, name: "管理人", lines: ["そのうち。", "気分。"] },
      // === 承：違和感 ===
      // frag_bbs取得済み
      {
        show: window.Arg1.hasFrag("frag_bbs"),
        name: "常連A",
        lines: [
          "管理人さん、最近文体変わった？",
          "前はもうちょっと絵文字多かったような。"
        ]
      },
      {
        show: window.Arg1.hasFrag("frag_bbs"),
        name: "管理人",
        lines: ["……そう？", "短いほうが好き。"]
      },
      { show: window.Arg1.hasFrag("frag_bbs"), name: "通りすがり", lines: ["言い方きついけど。", "優しい。"] },
      { show: window.Arg1.hasFrag("frag_bbs"), name: "名無しさん", lines: ["このサイト、落ち着く。"] },
      {
        show: window.Arg1.hasFrag("frag_bbs"),
        name: "名無しさん",
        lines: [
          "前の日記ってどこ行きました？",
          "6月より前のやつ。"
        ]
      },
      {
        show: window.Arg1.hasFrag("frag_bbs"),
        name: "管理人",
        lines: [
          "消した。",
          "……消えた？",
          "どっちだっけ。"
        ]
      },
      { show: window.Arg1.hasFrag("frag_bbs"), name: "名無しさん", lines: ["アーカイブって、まだ？"] },
      // === 転：混乱 ===
      // frag_archive取得済み
      { show: window.Arg1.hasFrag("frag_archive"), name: "管理人", lines: ["ログ整理中。", "気長に。"] },
      {
        show: window.Arg1.hasFrag("frag_archive"),
        name: "古参",
        lines: [
          "管理人さん、この前教えてくれた",
          "おすすめの巡回先、どこでしたっけ？",
          "ブクマし忘れて。"
        ]
      },
      {
        show: window.Arg1.hasFrag("frag_archive"),
        name: "管理人",
        lines: ["……教えた？", "ごめん、覚えてない。"]
      },
      {
        show: window.Arg1.hasFrag("frag_archive"),
        name: "古参",
        lines: [
          "え、先週くらいに。",
          "リンクページに載せるって言ってたのに。",
          "……まあいいけど。"
        ]
      },
      {
        show: window.Arg1.hasFrag("frag_archive"),
        name: "名無しさん",
        lines: [
          "前あった「お気に入りの曲」ってコーナー、どこ行った？",
          "BUMP好きって書いてあったのに。"
        ]
      },
      {
        show: window.Arg1.hasFrag("frag_archive"),
        name: "管理人",
        lines: ["……そんなの、あった？"]
      },
      { show: window.Arg1.hasFrag("frag_archive"), name: "名無しさん", lines: ["ページ、消えてない？", "大丈夫？"] }
    ];

    const container = document.getElementById("bbsLogs");
    logs.forEach((post) => {
      if (!post.show) return;
      const block = document.createElement("div");
      block.className = "block";
      const name = document.createElement("div");
      name.className = "zprof-heading";
      name.textContent = `NAME: ${post.name}`;
      block.appendChild(name);
      post.lines.forEach((line) => {
        const p = document.createElement("p");
        p.textContent = line;
        block.appendChild(p);
      });
      container.appendChild(block);
    });
    // 返信ボタン処理
    const replyBtn = document.getElementById("replyBtn");
    if (replyBtn && !window.Arg1.hasFrag("frag_bbs")) {
      const originalText = replyBtn.textContent;
      replyBtn.onclick = () => {
        replyBtn.disabled = true;
        replyBtn.textContent = "……届いた";
        replyBtn.classList.add("delivered");
        window.Arg1.grantFrag("frag_bbs");
        setTimeout(() => {
          replyBtn.textContent = originalText;
          replyBtn.disabled = false;
        }, 1500);
      };
    }
  })();
  </script>
</body>
</html>
