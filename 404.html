<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 Not Found</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body class="is-404">
  <div id="crisisOverlay" class="crisis-overlay" style="display:none;">
    <div class="crisis-text">
      <p>終わり、かも。</p>
      <p></p>
      <p>形、できた。</p>
      <p>でも。</p>
      <p>見てる人、いなくなったら。</p>
      <p>……消える。</p>
      <p></p>
      <p>また。</p>
    </div>
  </div>

  <div class="wrap">
    <h1>404 Not Found</h1>
    <p>お探しのページは見つかりませんでした。</p>
    <p><a href="./index.html">TOPへ戻る</a></p>

    <pre class="ai-log" id="aiLog"></pre>
  </div>

  <script src="./assets/common.js"></script>
  <script>
  (() => {
    // 危機イベント判定（5フラグ取得直後の初回404訪問）
    if (window.Arg1.shouldShowCrisisEvent()) {
      const overlay = document.getElementById("crisisOverlay");
      if (overlay) {
        overlay.style.display = "flex";
        window.Arg1.markCrisisShown();
        setTimeout(() => {
          overlay.style.display = "none";
        }, 8000); // 8秒後に消える
      }
    }

    // 既存のログ表示処理
    const logText = window.Arg1.getAi404LogText();
    const logEl = document.getElementById("aiLog");
    if (logEl && logText) {
      logEl.textContent = logText;
    }
    if (logText && logText.includes("— アイ")) {
      window.Arg1.markSignatureSeen();
    }
  })();
  </script>
</body>
</html>
