<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>リンク</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <script src="./assets/common.js"></script>
  <script>
  window.Arg1.softRedirectToIndexIfNeeded(["frag_diary"]);
  </script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>＊リンク＊</h1>
    </header>

    <p>巡回用。</p>
    <p>だいたい夜。</p>

    <ul class="menu" id="linkList"></ul>

    <p class="small">※直リンク歓迎</p>
    <p><a href="./index.html">TOPへ</a></p>
  </div>

  <script>
  (() => {
    const visits = window.Arg1.addPageVisit("links");
    if (visits >= 3) {
      window.Arg1.grantFrag("frag_links");
    }

    const items = [
      {
        show: true,
        label: "夜の文字置き場",
        note: "眠れない用。"
      },
      {
        show: true,
        label: "炭酸研究所",
        note: "冷たいのが正義。"
      },
      {
        show: visits >= 2,
        label: "曇りガラス同盟",
        note: "ぼやけたまま。"
      },
      {
        show: visits >= 2,
        label: "工事中同盟",
        note: "未完成が好き。"
      },
      {
        show: visits >= 3 || window.Arg1.hasFrag("frag_links"),
        label: "掲示板ログ保管庫",
        note: "声が残る。"
      },
      {
        show: visits >= 4 || window.Arg1.hasFrag("frag_bbs"),
        label: "404の静けさ",
        note: "行き止まり、落ち着く。"
      },
      {
        show: visits >= 5,
        label: "夜更かしノート",
        note: "ねむれない用。"
      },
      {
        show: visits >= 6,
        label: "欠片リスト",
        note: "埋まるまで。"
      }
    ];

    const list = document.getElementById("linkList");
    items.forEach((item) => {
      if (!item.show) return;
      const li = document.createElement("li");
      const link = document.createElement("a");
      link.href = "#";
      link.textContent = item.label;
      li.appendChild(link);
      if (item.note) {
        const note = document.createElement("span");
        note.className = "note";
        note.textContent = item.note;
        li.appendChild(note);
      }
      list.appendChild(li);
    });
  })();
  </script>
</body>
</html>
