<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>リンク</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <script src="./assets/common.js"></script>
  <script>
  window.Arg1.softRedirectToIndexIfNeeded(["frag_diary"]);
  </script>
</head>
<body class="has-archive-bar">
  <div class="archive-bar">
    <span class="archive-bar__icon">📦</span>
    <span class="archive-bar__text">このサイトは 200X年 に保存されたアーカイブです</span>
    <a class="archive-bar__link" href="#">詳細</a>
  </div>
  <div class="wrap">
    <header>
      <h1>＊リンク＊</h1>
    </header>

    <div class="retro-marquee"><span>♪ 巡回リンク集 ♪ 勝手にリンクOK ♪ 報告いらないよ ♪</span></div>

    <p>巡回用。</p>
    <p>だいたい夜。</p>

    <ul class="menu" id="linkList"></ul>

    <div class="deco-hr">･ﾟ✧ ･ﾟ✧ ･ﾟ✧</div>

    <p class="small">※直リンク歓迎</p>
    <p><a href="./index.html">TOPへ</a></p>
  </div>

  <script>
  (() => {
    const visits = window.Arg1.addPageVisit("links");

    const items = [
      // 常時表示
      { show: true, label: "夜の文字置き場", note: "眠れない用。" },
      { show: true, label: "炭酸研究所", note: "冷たいのが正義。" },
      // frag_links取得済み
      { show: window.Arg1.hasFrag("frag_links"), label: "曇りガラス同盟", note: "ぼやけたまま。" },
      { show: window.Arg1.hasFrag("frag_links"), label: "工事中同盟", note: "未完成が好き。" },
      { show: window.Arg1.hasFrag("frag_links"), label: "掲示板ログ保管庫", note: "声が残る。" },
      // frag_bbs取得済み
      { show: window.Arg1.hasFrag("frag_bbs"), label: "404の静けさ", note: "行き止まり、落ち着く。" },
      { show: window.Arg1.hasFrag("frag_bbs"), label: "夜更かしノート", note: "ねむれない用。" },
      // frag_archive取得済み
      { show: window.Arg1.hasFrag("frag_archive"), label: "欠片リスト", note: "埋まるまで。" }
    ];

    const list = document.getElementById("linkList");
    const hoveredSet = new Set();
    let totalItems = 0;
    let completed = false; // 完了フラグ（連続発火防止）

    const markSeen = (index, li) => {
      if (completed) return;
      hoveredSet.add(index);
      li.classList.add("hovered");

      // 全項目ホバー完了チェック
      if (hoveredSet.size === totalItems) {
        completed = true;
        window.Arg1.grantFrag("frag_links");
        showCompleteMessage();
      }
    };

    items.forEach((item, index) => {
      if (!item.show) return;
      totalItems++;
      const li = document.createElement("li");
      li.className = "link-item";
      li.dataset.index = index;

      const link = document.createElement("a");
      link.href = "#";
      link.textContent = item.label;
      // 実リンクではないため、タップ時のページジャンプを防ぐ
      link.addEventListener("click", (event) => event.preventDefault());
      li.appendChild(link);
      if (item.note) {
        const note = document.createElement("span");
        note.className = "note";
        note.textContent = item.note;
        li.appendChild(note);
      }

      // ホバー依存を避け、タッチ/キーボードでも進行可能にする
      if (!window.Arg1.hasFrag("frag_links")) {
        li.addEventListener("mouseenter", () => markSeen(index, li));
        li.addEventListener("focusin", () => markSeen(index, li));
        li.addEventListener("click", () => markSeen(index, li));
      }

      list.appendChild(li);
    });

    function showCompleteMessage() {
      // 既にメッセージがあれば何もしない
      if (document.querySelector(".hover-complete-msg")) return;
      const msg = document.createElement("p");
      msg.className = "hover-complete-msg";
      msg.textContent = "……全部、見てくれた";
      list.after(msg);
      setTimeout(() => msg.classList.add("show"), 100);
      setTimeout(() => msg.classList.remove("show"), 2000);
    }
  })();
  </script>
</body>
</html>
