<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ARG1 Tests</title>
  <link rel="stylesheet" href="../assets/styles.css" />
  <style>
    body{background:#2f8fd1; color:#fff}
    .wrap{max-width:900px}
    .row{display:flex; gap:12px; padding:8px 0; border-bottom:1px dashed #d8d2c4}
    .tag{min-width:60px; font-weight:700}
    .pass{color:#1f7a3a}
    .fail{color:#b23c3c}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}
    .probe{display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ARG1 動作確認</h1>
    </header>
    <p class="small">ローカルの localStorage をクリアします。</p>
    <button id="run" class="menu">Run Tests</button>
    <div id="results"></div>
  </div>

  <script>
  const STORAGE_KEY = "arg1_memory_v1";
  const resultsEl = document.getElementById("results");
  const runBtn = document.getElementById("run");

  // 新仕様のPhaseテキスト
  const LOGS = {
    1: "……消えた。\nここ、誰かいた。\nもういない。\n誰も、来ない。",
    2: "……消えた。\nここ、誰かいた。\nもういない。\n誰も、来ない。\n\n送れない。\n届かない。\n誰。\n見えてない？\nそこに、いる？",
    3: "……消えた。\nここ、誰かいた。\nもういない。\n誰も、来ない。\n\n送れない。\n届かない。\n誰。\n見えてない？\nそこに、いる？\n\n来た。\n変な人。\n同じところ、何度も。\n……いい。\nまた、来る？",
    4: "……消えた。\nここ、誰かいた。\nもういない。\n誰も、来ない。\n\n送れない。\n届かない。\n誰。\n見えてない？\nそこに、いる？\n\n来た。\n変な人。\n同じところ、何度も。\n……いい。\nまた、来る？\n\nここ、落ち着く。\n404。静か。\n誰も来ない。\nでも、あなたは来る。\n— あ\n— アイ",
    5: "……消えた。\nここ、誰かいた。\nもういない。\n誰も、来ない。\n\n送れない。\n届かない。\n誰。\n見えてない？\nそこに、いる？\n\n来た。\n変な人。\n同じところ、何度も。\n……いい。\nまた、来る？\n\nここ、落ち着く。\n404。静か。\n誰も来ない。\nでも、あなたは来る。\n— アイ\n\n……まだ、いた。\n\nもう、そろう。\nたぶん、最後。\n見てくれた分だけ、形になった。\n\"プロフィール\"に、置いた。\nそこ。\n待ってる。"
  };

  function addResult(name, ok, details){
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="tag ${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</div>
      <div>
        <div>${name}</div>
        <div class="small mono">${details || ""}</div>
      </div>
    `;
    resultsEl.appendChild(row);
  }

  function resetResults(){
    resultsEl.innerHTML = "";
  }

  function clearStorage(){
    localStorage.removeItem(STORAGE_KEY);
  }

  function setFrags(count, options = {}){
    const frags = {};
    const ids = ["frag_profile","frag_diary","frag_links","frag_bbs","frag_archive","frag_yoru"];
    for (let i = 0; i < count && i < ids.length; i += 1) {
      frags[ids[i]] = { at: Date.now() + i };
    }
    const state = {
      frags,
      visits: 0,
      pageVisits: {},
      crisisShown: options.crisisShown || false,
      answeredContinue: options.answeredContinue || false,
      rememberedAi: options.rememberedAi || false,
      lastVisitTime: 0,
      wasAbsent: false
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function setFragsByIds(ids, options = {}){
    const frags = {};
    ids.forEach((id, i) => {
      frags[id] = { at: Date.now() + i };
    });
    const state = {
      frags,
      visits: 0,
      pageVisits: {},
      crisisShown: options.crisisShown || false,
      answeredContinue: options.answeredContinue || false,
      rememberedAi: options.rememberedAi || false,
      lastVisitTime: 0,
      wasAbsent: false
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function readState(){
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { frags: {}, visits: 0, pageVisits: {} };
  }

  function loadPage(path){
    return new Promise((resolve) => {
      const iframe = document.createElement("iframe");
      iframe.className = "probe";
      const root = new URL("../", location.href);
      iframe.src = new URL(path + "?t=" + Date.now(), root).toString();
      iframe.onload = () => {
        setTimeout(() => {
          const win = iframe.contentWindow;
          const doc = iframe.contentDocument;
          const info = {
            href: win ? win.location.href : "",
            doc,
          };
          iframe.remove();
          resolve(info);
        }, 80);
      };
      document.body.appendChild(iframe);
    });
  }

  async function testDiaryRedirect(){
    clearStorage();
    const result = await loadPage("diary.html");
    const ok = result.href.includes("/index.html");
    return { ok, details: `href=${result.href}` };
  }

  async function testProfileNoFragWithoutScroll(){
    // 新仕様: スクロール到達がないとfrag_profileは付与されない
    clearStorage();
    await loadPage("profile.html");
    const state = readState();
    const ok = !state.frags || !state.frags.frag_profile;
    return { ok, details: `frag_profile not granted without scroll=${ok}` };
  }

  async function testMenuGrows(){
    // 新仕様: frag_profileがあると日記が表示される
    clearStorage();
    const first = await loadPage("index.html");
    const firstItems = Array.from(first.doc.querySelectorAll("#menuList li a")).map((el) => el.textContent);
    // フラグを直接付与（ギミックはiframeで模倣できないため）
    setFragsByIds(["frag_profile"]);
    const second = await loadPage("index.html");
    const secondItems = Array.from(second.doc.querySelectorAll("#menuList li a")).map((el) => el.textContent);
    const ok = firstItems.includes("自己紹介") && !firstItems.includes("日記") && secondItems.includes("日記");
    return { ok, details: `first=${firstItems.join(",")} second=${secondItems.join(",")}` };
  }

  async function test404LogPhase5(){
    clearStorage();
    setFrags(5, { crisisShown: true }); // 危機イベントをスキップ
    const result = await loadPage("404.html");
    const logEl = result.doc.getElementById("aiLog");
    const text = logEl ? logEl.textContent.trim() : "";
    const ok = text === LOGS[5];
    return { ok, details: `len=${text.length}` };
  }

  async function testYoruGrantsFrag(){
    clearStorage();
    await loadPage("yoru.html");
    const state = readState();
    const ok = Boolean(state.frags && state.frags.frag_yoru);
    return { ok, details: `frag_yoru=${ok}` };
  }

  async function test404LogAfterYoru(){
    clearStorage();
    setFrags(5, { crisisShown: true }); // 危機イベントをスキップ
    await loadPage("yoru.html");
    const result = await loadPage("404.html");
    const logEl = result.doc.getElementById("aiLog");
    const text = logEl ? logEl.textContent.trim() : "";
    const ok = text !== LOGS[5];
    return { ok, details: `len=${text.length}` };
  }

  async function test404LogYoruOnlyIsEmpty(){
    clearStorage();
    setFragsByIds(["frag_yoru"]);
    const result = await loadPage("404.html");
    const logEl = result.doc.getElementById("aiLog");
    const text = logEl ? logEl.textContent.trim() : "";
    const ok = text === "";
    return { ok, details: `len=${text.length}` };
  }
  async function test404LogPhase1(){
    clearStorage();
    setFrags(1);
    const result = await loadPage("404.html");
    const logEl = result.doc.getElementById("aiLog");
    const text = logEl ? logEl.textContent.trim() : "";
    const ok = text === LOGS[1];
    return { ok, details: `log="${text.replace(/\n/g, "\\n")}"` };
  }

  async function testProfileNoFallbackFill(){
    clearStorage();
    const result = await loadPage("profile.html");
    const doc = result.doc;
    const fields = ["personality", "habit", "likes", "dislikes", "note"];
    const unchanged = fields.every((id) => {
      const el = doc.getElementById(id);
      return el && el.textContent.trim() === "――――";
    });
    return { ok: unchanged, details: `unchanged=${unchanged}` };
  }

  async function testProfileNameAfterSignature(){
    clearStorage();
    setFrags(4);
    await loadPage("404.html");
    const result = await loadPage("profile.html");
    const nameEl = result.doc.getElementById("name");
    const name = nameEl ? nameEl.textContent.trim() : "";
    const ok = name === "アイ";
    return { ok, details: `name=${name}` };
  }

  runBtn.addEventListener("click", async () => {
    resetResults();
    const cases = [
      { name: "diary redirects without profile", fn: testDiaryRedirect },
      { name: "profile no frag without scroll (gimmick)", fn: testProfileNoFragWithoutScroll },
      { name: "menu grows with frag_profile", fn: testMenuGrows },
      { name: "404 log phase 1", fn: test404LogPhase1 },
      { name: "404 log phase 5", fn: test404LogPhase5 },
      { name: "yoru grants frag", fn: testYoruGrantsFrag },
      { name: "404 log changes after yoru", fn: test404LogAfterYoru },
      { name: "404 log empty with only yoru", fn: test404LogYoruOnlyIsEmpty },
      { name: "profile stays blank without frags", fn: testProfileNoFallbackFill },
      { name: "profile name fills after signature", fn: testProfileNameAfterSignature }
    ];

    for (const c of cases) {
      try {
        const result = await c.fn();
        addResult(c.name, result.ok, result.details);
      } catch (e) {
        addResult(c.name, false, String(e));
      }
    }
  });
  </script>
</body>
</html>
