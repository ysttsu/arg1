<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 Progression Tests</title>
  <meta property="og:image" content="https://ysttsu.github.io/arg1/assets/ogp-404.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:image" content="https://ysttsu.github.io/arg1/assets/ogp-404.png" />
  <style>
    :root{
      color-scheme: light;
    }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Kaku Gothic ProN",
                   "Hiragino Sans", "Noto Sans JP", "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:#f6f7fb;
      color:#101420;
    }
    .wrap{
      max-width:860px;
      margin:24px auto;
      padding:18px;
      background:#fff;
      border:1px solid #e5e9f2;
      border-radius:16px;
      box-shadow:0 8px 20px rgba(16,20,32,.06);
    }
    h1{margin:0 0 8px; font-size:20px}
    p{margin:8px 0}
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:8px 12px; border-radius:10px;
      border:1px solid #cdd3df;
      background:#f2f4f9; cursor:pointer;
    }
    .results{margin-top:16px}
    .row{
      display:flex; align-items:flex-start; gap:10px;
      padding:8px 0; border-bottom:1px dashed #e6e9f1;
      font-size:14px;
    }
    .pass{color:#0b7a2b; font-weight:600}
    .fail{color:#c22b2b; font-weight:600}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}
    .probe{display:none}
    .note{font-size:12px; color:#56607a}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>404 Progression Tests</h1>
    <p>404ページの進行ルールを、実際の <span class="mono">404.html</span> を読み込んで検証します。</p>
    <p class="note">注意: テストは <span class="mono">localStorage</span> をクリアします。</p>
    <button class="btn" id="run">Run Tests</button>
    <div class="results" id="results"></div>
  </div>

  <script>
  const ORDER = ["ABOUT","ARCHIVE","TERMS","CONTACT","ERROR","PRIVACY"];

  const resultsEl = document.getElementById("results");
  const runBtn = document.getElementById("run");

  function addResult(name, ok, details){
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</div>
      <div>
        <div>${name}</div>
        <div class="note mono">${details || ""}</div>
      </div>
    `;
    resultsEl.appendChild(row);
  }

  function resetResults(){
    resultsEl.innerHTML = "";
  }

  function clearStorage(){
    localStorage.clear();
  }

  function simulateVisit(pageId){
    localStorage.setItem("last_page", pageId);
    localStorage.setItem("last_seen_at", String(Date.now()));
  }

  function readNum(key){
    return Number(localStorage.getItem(key) || "0");
  }

  function readStr(key){
    return localStorage.getItem(key);
  }

  function load404(){
    return new Promise((resolve) => {
      const iframe = document.createElement("iframe");
      iframe.className = "probe";
      iframe.src = new URL("../404.html?probe=" + Date.now(), location.href).toString();
      iframe.onload = () => {
        setTimeout(() => {
          iframe.remove();
          resolve();
        }, 80);
      };
      document.body.appendChild(iframe);
    });
  }

  async function testCorrectOrder(){
    clearStorage();
    for (let i = 0; i < ORDER.length; i += 1) {
      simulateVisit(ORDER[i]);
      await load404();
      const progress = readNum("progress");
      const mistakes = readNum("mistakes");
      if (progress !== i + 1 || mistakes !== 0) {
        return { ok:false, details:`step=${i} progress=${progress} mistakes=${mistakes}` };
      }
    }
    const completed = readStr("completed") === "1";
    return { ok:completed, details:`completed=${readStr("completed")}` };
  }

  async function testWrongOrder(){
    clearStorage();
    simulateVisit("CONTACT");
    await load404();
    const progress = readNum("progress");
    const mistakes = readNum("mistakes");
    const ok = progress === 0 && mistakes === 1;
    return { ok, details:`progress=${progress} mistakes=${mistakes}` };
  }

  async function testRecoveryAfterMistake(){
    clearStorage();
    simulateVisit("ABOUT");
    await load404();
    simulateVisit("CONTACT");
    await load404();
    simulateVisit("ARCHIVE");
    await load404();
    const progress = readNum("progress");
    const mistakes = readNum("mistakes");
    const ok = progress === 2 && mistakes === 1;
    return { ok, details:`progress=${progress} mistakes=${mistakes}` };
  }

  runBtn.addEventListener("click", async () => {
    resetResults();
    const cases = [
      { name: "Correct order completes", fn: testCorrectOrder },
      { name: "Wrong order increments mistakes", fn: testWrongOrder },
      { name: "Recovery after mistake", fn: testRecoveryAfterMistake },
    ];
    for (const c of cases) {
      try{
        const result = await c.fn();
        addResult(c.name, result.ok, result.details);
      }catch(e){
        addResult(c.name, false, String(e));
      }
    }
  });
  </script>
</body>
</html>
