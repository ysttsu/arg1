<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>リセット</title>
  <link rel="stylesheet" href="/arg1/assets/styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>＊リセット＊</h1>
    </header>

    <p>最初からやり直します。</p>
    <p class="small">記録を消します。表示は変わります。</p>

    <div class="block">
      <p><a href="#" id="doReset">消して戻る</a></p>
      <p><a href="/arg1/index.html">キャンセル</a></p>
    </div>
  </div>

  <script src="/arg1/assets/common.js"></script>
  <script>
  (() => {
    const btn = document.getElementById("doReset");
    if (!btn) return;
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      window.Arg1.resetState();
      location.href = "/arg1/index.html";
    });
  })();
  </script>
</body>
</html>
