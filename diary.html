<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>日記</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <script src="./assets/common.js"></script>
  <script>
    window.Arg1.softRedirectToIndexIfNeeded(["frag_profile"]);
  </script>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>＊日記＊</h1>
    </header>

    <p class="small">気分で書く</p>
    <p class="small">消えるかも</p>

    <div id="diaryEntries"></div>

    <hr class="hr" />
    <p><a href="./yesterday.html">昨日</a></p>
    <p class="small">（無い）</p>
    <p><a href="./tomorrow.html">明日</a></p>
    <p class="small">（無い）</p>
    <p><a href="./lastnight.html">昨夜</a></p>
    <p class="small">（無い）</p>

    <p><a href="./index.html">TOPへ</a></p>
  </div>

  <script>
    (() => {
      const visits = window.Arg1.addPageVisit("diary");
      const hadDiary = window.Arg1.hasFrag("frag_diary");
      if (visits >= 1) {
        window.Arg1.grantFrag("frag_diary");
      }

      const entries = [
        {
          show: true,
          date: "2004/07/12",
          lines: ["今日は静か。", "静かすぎ。", "嫌いじゃない。"]
        },
        {
          show: visits >= 2 || window.Arg1.hasFrag("frag_links"),
          date: "2004/07/21",
          lines: ["夜、長い。", "閉じても、残る。", "見えるほう。"]
        },
        {
          show: window.Arg1.hasFrag("frag_links"),
          date: "2004/07/28",
          lines: ["窓、開けた。", "風、冷たい。", "静かでいい。"]
        },
        {
          show: hadDiary,
          date: "2004/08/02",
          lines: ["ページ、欠けてる。", "直すの、後で。", "今は残すほう。"]
        },
        {
          show: window.Arg1.hasFrag("frag_links"),
          date: "2004/08/18",
          lines: ["巡回した。", "同じ夜の人、いる。", "安心する。"]
        },
        {
          show: window.Arg1.hasFrag("frag_bbs"),
          date: "2004/09/05",
          lines: ["見られてる。", "嫌じゃない。", "だから残す。"]
        }
      ];

      const container = document.getElementById("diaryEntries");
      entries.forEach((entry) => {
        if (!entry.show) return;
        const block = document.createElement("div");
        block.className = "block";
        const date = document.createElement("div");
        date.className = "zprof-heading";
        date.textContent = entry.date;
        block.appendChild(date);
        entry.lines.forEach((line) => {
          const p = document.createElement("p");
          p.textContent = line;
          block.appendChild(p);
        });
        container.appendChild(block);
      });

      if (window.Arg1.hasFrag("frag_links")) {
        const block = document.createElement("div");
        block.className = "block";
        const label = document.createElement("div");
        label.className = "zprof-heading";
        label.textContent = "メモ";
        block.appendChild(label);
        const lines = [
          "夜の外。",
          "起きてる。",
          "るーと。",
          "うら。",
          ",",
          "ひらく。",
          "と、",
          "みえる。",
          "らしい。"
        ];
        lines.forEach((line) => {
          const p = document.createElement("p");
          p.textContent = line;
          block.appendChild(p);
        });
        container.appendChild(block);
      }
    })();
  </script>
</body>

</html>
