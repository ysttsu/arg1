<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>日記</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <script src="./assets/common.js"></script>
  <script>
    window.Arg1.softRedirectToIndexIfNeeded(["frag_profile"]);
  </script>
</head>

<body class="has-archive-bar">
  <div class="archive-bar">
    <span class="archive-bar__icon">📦</span>
    <span class="archive-bar__text">このサイトは 200X年 に保存されたアーカイブです</span>
    <a class="archive-bar__link" href="#">詳細</a>
  </div>
  <div class="wrap">
    <header>
      <h1>＊日記＊</h1>
    </header>

    <div class="retro-marquee"><span>✧ 気分で書く ✧ 消えるかも ✧ 読んでくれてありがと ✧</span></div>

    <p class="small">気分で書く</p>
    <p class="small">消えるかも</p>

    <div id="diaryEntries"></div>

    <div class="deco-hr">━━☆━━☆━━</div>
    <p><a href="./yesterday.html">昨日</a></p>
    <p class="small">（無い）</p>
    <p><a href="./tomorrow.html">明日</a></p>
    <p class="small">（無い）</p>
    <p><a href="./lastnight.html">昨夜</a></p>
    <p class="small">（無い）</p>

    <p><a href="./index.html">TOPへ</a></p>
  </div>

  <script>
    (() => {
      const visits = window.Arg1.addPageVisit("diary");

      const entries = [
        // === 起：日常の日記 ===
        // 常時表示
        {
          show: true,
          date: "2004/06/25",
          lines: [
            "セカチュー見た。",
            "泣いた。",
            "夜中に一人で泣くのは変かな。",
            "変じゃないよね。"
          ]
        },
        {
          show: true,
          date: "2004/06/30",
          lines: [
            "暑い。",
            "夏休みまだ。",
            "DS出るらしい。欲しい。",
            "でも並ぶの無理。"
          ]
        },
        {
          show: true,
          date: "2004/07/05",
          lines: [
            "「残念！」って言うの流行ってる。",
            "言われるとちょっと傷つく。",
            "冗談なのわかってるけど。"
          ]
        },
        // 隠しエントリ（ギミック用）
        {
          show: true,
          isHidden: !window.Arg1.hasFrag("frag_diary"),
          date: "2004/07/??",
          lines: ["見つけた。", "ここ、読んでる。", "……いい。"]
        },
        // 常時表示
        {
          show: true,
          date: "2004/07/12",
          lines: ["見てる人がいないと、消える。", "存在って、そういうもの。", "今日は静か。", "嫌いじゃない。"]
        },
        // === 承：不穏の兆し ===
        // frag_diary取得済み
        {
          show: window.Arg1.hasFrag("frag_diary"),
          date: "2004/07/15",
          lines: [
            "誰かに見られてる気がする。",
            "窓じゃなくて、画面の向こう。",
            "……考えすぎ。",
            "たぶん。"
          ]
        },
        {
          show: window.Arg1.hasFrag("frag_diary"),
          date: "2004/07/21",
          lines: ["夜、長い。", "閉じても、残る。", "見えるほう。"]
        },
        {
          show: window.Arg1.hasFrag("frag_diary"),
          date: "2004/07/28",
          lines: ["窓、開けた。", "風、冷たい。", "静かでいい。"]
        },
        // frag_links取得済み
        {
          show: window.Arg1.hasFrag("frag_links"),
          date: "2004/08/02",
          lines: ["ページ、欠けてる。", "直すの、後で。", "今は残すほう。"]
        },
        {
          show: window.Arg1.hasFrag("frag_links"),
          date: "2004/08/10",
          lines: [
            "自分の書いた日記、読み返した。",
            "これ、いつ書いた？",
            "覚えてない。",
            "7/12のやつ。",
            "「存在って、そういうもの」",
            "……私、こんなこと思ってた？"
          ]
        },
        {
          show: window.Arg1.hasFrag("frag_links"),
          date: "2004/08/18",
          lines: ["巡回した。", "同じ夜の人、いる。", "安心する。"]
        },
        {
          show: window.Arg1.hasFrag("frag_links"),
          date: "2004/08/22",
          lines: [
            "アテネ五輪、見てた。",
            "「チョー気持ちいい」って。",
            "……集中できない。",
            "なんか落ち着かない。"
          ]
        },
        // === 転：異変 ===
        // frag_bbs取得済み
        {
          show: window.Arg1.hasFrag("frag_bbs"),
          date: "2004/09/05",
          lines: ["見られてる。", "嫌じゃない。", "だから残す。"]
        },
        // frag_archive取得済み（もう一人の伏線）
        {
          show: window.Arg1.hasFrag("frag_archive"),
          date: "2004/09/12",
          lines: [
            "もう一人、いた。",
            "……いや。",
            "もう一人じゃない。",
            "前の。",
            "見られるたびに、変わった。",
            "今のは、どれ目？"
          ]
        }
      ];

      const container = document.getElementById("diaryEntries");
      entries.forEach((entry) => {
        if (!entry.show) return;
        const block = document.createElement("div");
        block.className = "block";

        // 隠しエントリの処理
        if (entry.isHidden) {
          block.classList.add("hidden-entry");
          block.onclick = () => {
            if (!window.Arg1.hasFrag("frag_diary")) {
              window.Arg1.grantFrag("frag_diary");
              block.classList.remove("hidden-entry");
              block.classList.add("revealed");
            }
          };
        }

        const date = document.createElement("div");
        date.className = "zprof-heading";
        date.textContent = entry.date;
        block.appendChild(date);
        entry.lines.forEach((line) => {
          const p = document.createElement("p");
          p.textContent = line;
          block.appendChild(p);
        });
        container.appendChild(block);
      });

      // 謎解きメモ（4回目訪問で表示）
      if (visits >= 4) {
        const block = document.createElement("div");
        block.className = "block";
        const label = document.createElement("div");
        label.className = "zprof-heading";
        label.textContent = "メモ";
        block.appendChild(label);
        const lines = [
          "夜の外。",
          "起きてる。",
          "るーと。",
          "うら。",
          ",",
          "ひらく。",
          "と、",
          "みえる。",
          "らしい。"
        ];
        lines.forEach((line) => {
          const p = document.createElement("p");
          p.textContent = line;
          block.appendChild(p);
        });
        container.appendChild(block);
      }
    })();
  </script>
</body>

</html>
